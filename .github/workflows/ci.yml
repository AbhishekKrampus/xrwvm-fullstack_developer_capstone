name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install backend dependencies
      working-directory: server/djangoapp
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Django migrations and checks
      working-directory: server/djangoapp
      run: |
        python manage.py migrate --noinput
        python manage.py check
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install frontend dependencies
      working-directory: server/frontend
      run: |
        npm ci
    - name: Install database service dependencies
      working-directory: server/database
      run: |
        npm ci
    - name: Run frontend build (optional)
      working-directory: server/frontend
      run: |
        npm run build --if-present
    - name: List directory contents
      run: ls -R
